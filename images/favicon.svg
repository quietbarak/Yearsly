    <line x1="17" y1="21" x2="17" y2="16.7" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="17" y1="21" x2="20" y2="22.8" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
