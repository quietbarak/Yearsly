<svg width="64" height="64" viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Rounded square background for crisp favicon rendering at small sizes -->
