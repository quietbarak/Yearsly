<svg width="200" height="48" viewBox="0 0 200 48" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Icon: calendar page with a clock hand, symbolizing "years" being tracked over "time" -->
  <g transform="translate(0, 4)">
    <!-- Calendar body -->
    <rect x="2" y="4" width="34" height="34" rx="7" fill="none" stroke="#2563EB" stroke-width="2.5"/>
    <!-- Calendar top binding hangers -->
    <rect x="10" y="0" width="3" height="8" rx="1.5" fill="#2563EB"/>
    <rect x="25" y="0" width="3" height="8" rx="1.5" fill="#2563EB"/>
    <!-- Calendar header band -->
    <path d="M2 13 a7 7 0 0 1 7 -7 h20 a7 7 0 0 1 7 7 v2 H2 Z" fill="#2563EB"/>
    <!-- Clock face representing "today", replacing a date number -->
    <circle cx="19" cy="24" r="8.5" fill="#EFF4FF" stroke="#2563EB" stroke-width="2"/>
    <!-- Clock hands pointing to a forward-moving time, echoing "years passing" -->
    <line x1="19" y1="24" x2="19" y2="19" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <line x1="19" y1="24" x2="22.5" y2="26" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <circle cx="19" cy="24" r="1.3" fill="#2563EB"/>
  </g>

  <!-- Wordmark -->
  <text x="46" y="31" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700">
    <tspan fill="#0F172A">Years</tspan><tspan fill="#2563EB">ly</tspan>
  </text>
</svg>
