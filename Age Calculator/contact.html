<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Yearsly</title>
    <meta name="description" content="Contact Yearsly. Reach out with questions, feedback, or suggestions.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <div class="logo">
                    <img src="images/logo.svg" alt="Yearsly" class="logo-img">
                </div>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="age-calculator.html">Tools</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Have questions or feedback? We would love to hear from you.</p>
        </div>
    </section>

    <section style="padding: 60px 20px; max-width: 600px; margin: 0 auto;">
        <div class="calculator-card">

            <form action="https://formspree.io/f/maeygvkd" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" placeholder="How can we help?" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Write your message here..."
                        required></textarea>
                </div>
                <div style="text-align: right;">
                    <button type="submit" class="btn">Send Message</button>
                </div>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Yearsly. All rights reserved.</p>
            <p><a href="privacy-policy.html">Privacy Policy</a> | <a href="terms.html">Terms</a> | <a
                    href="about.html">About</a></p>
        </div>
    </footer>
</body>

</html>
